function setUI(u){
  UI = UI_LANGS.indexOf(u) >= 0 ? u : "en"; if(profile){ profile.ui = UI; store.set("profile", profile); } store.set("ui", UI);
  document.documentElement.lang = UI === "zh" ? "zh-CN" : UI;
  applyTrLang(); onRoute();
}
function applyTheme(){
  var dark = prefs.theme === "dark" || (prefs.theme === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  var m = $('meta[name="theme-color"]'); if(m) m.content = dark ? "#0e0d1f" : "#fbf7f1";
}
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if(prefs.theme === "auto") applyTheme(); }); }catch(e){}
function exportData(){
  var data = {app:"SlangBridge", exported:new Date().toISOString(), profile:profile, prefs:Object.assign({}, prefs), stats:stats, deck:deck, lessons:lessonsDone, aiLessons:aiLessons, connect:conn, culture:cultureRead, history:history_, phrasebook:saved};
  try{
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "slangbridge-data-" + dayKey() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(t("exported"));
  }catch(e){ toast(t("errFail")); }
}

/* ============================================================
   Onboarding
   ============================================================ */
var OB = null;
var GOALS = [["exchange","🎓"],["friends","🤝"],["work","💼"],["travel","🧳"],["curious","✨"]];
function startOnboarding(){
  OB = {step:0, d:{name:"", ui:UI, native:"", learning:[], level:"B1", interests:[], goal:"exchange", daily:50}};
  renderOnb();
}
function renderOnb(){
  var d = OB.d, s = OB.step, steps = 6, body = "", ok = true;
  var say = ["obSay0","obSay1","obSay2","obSay3","obSay4","obSay5"][s];
  if(s === 0){
    body = '<div class="pick-grid">' + UI_LANGS.map(function(l){ return '<button class="pick" data-act="obUi" data-l="' + l + '" aria-pressed="' + (d.ui === l) + '"><span class="em">' + LANG_FLAG[l] + "</span>" + esc(langName(l)) + "</button>"; }).join("") + "</div>" +
      '<label class="kicker" for="obName">' + esc(t("obName")) + '</label><input class="field" id="obName" maxlength="30" value="' + esc(d.name) + '" placeholder="' + esc(t("obNamePh")) + '">';
  } else if(s === 1){
    body = '<div class="pick-grid">' + ALL_LANGS.map(function(l){ return '<button class="pick" data-act="obNative" data-l="' + l + '" aria-pressed="' + (d.native === l) + '"><span class="em">' + LANG_FLAG[l] + "</span>" + esc(langName(l)) + "</button>"; }).join("") + "</div>";
    ok = !!d.native;
  } else if(s === 2){
    body = '<div class="pick-grid">' + LEARN.filter(function(l){ return l !== d.native; }).map(function(l){ return '<button class="pick" data-act="obLearn" data-l="' + l + '" aria-pressed="' + (d.learning.indexOf(l) >= 0) + '"><span class="em">' + LANG_FLAG[l] + "</span>" + esc(langName(l)) + "</button>"; }).join("") + "</div>";
    ok = d.learning.length > 0;
  } else if(s === 3){
    body = '<div class="pick-grid">' + ["A2","B1","B2","C1"].map(function(v){ return '<button class="pick wide" data-act="obLevel" data-v="' + v + '" aria-pressed="' + (d.level === v) + '"><span class="em">' + {A2:"🌱",B1:"🌿",B2:"🌳",C1:"🏔️"}[v] + "</span><span>" + v + " · " + esc(t("lv_" + v)) + "<small>" + esc(t("lvd_" + v)) + "</small></span></button>"; }).join("") + "</div>";
  } else if(s === 4){
    body = '<div class="pick-grid">' + INTERESTS.map(function(i){ return '<button class="pick" data-act="obInt" data-i="' + i + '" aria-pressed="' + (d.interests.indexOf(i) >= 0) + '"><span class="em">' + INTEREST_ICON[i] + "</span>" + esc(t("int_" + i)) + "</button>"; }).join("") + "</div>" +
      '<p class="small muted">' + esc(t("obIntHint")) + "</p>";
    ok = d.interests.length > 0;
  } else if(s === 5){
    body = '<p class="kicker">' + esc(t("obGoal")) + '</p><div class="pick-grid">' + GOALS.map(function(g){ return '<button class="pick" data-act="obGoal" data-g="' + g[0] + '" aria-pressed="' + (d.goal === g[0]) + '"><span class="em">' + g[1] + "</span>" + esc(t("goal_" + g[0])) + "</button>"; }).join("") + "</div>" +
      '<p class="kicker">' + esc(t("dailyGoal")) + '</p><div class="pick-grid">' + [[20,"dg20"],[50,"dg50"],[80,"dg80"],[120,"dg120"]].map(function(g){ return '<button class="pick" data-act="obDaily" data-n="' + g[0] + '" aria-pressed="' + (d.daily === g[0]) + '"><span>' + esc(t(g[1])) + "<small>" + g[0] + " XP</small></span></button>"; }).join("") + "</div>";
  }
  var h = '<div class="onb" role="dialog" aria-modal="true"><div class="onb-in"><div class="onb-top"><span class="brand" style="padding:0">' + brandHTML() + '</span><div class="bar"><i style="width:' + Math.round(100 * (s + 1) / steps) + '%"></i></div></div>' +
    '<div class="say-row">' + mascot(s === 0 ? "wink" : s === 5 ? "wow" : "happy", 96, s === 0 ? "jump" : "") + '<div class="speech">' + esc(t(say, {name:d.name ? ({zh:"，",ja:"、"}[UI] || ", ") + d.name : ""})) + "</div></div>" +
    "<h2>" + esc(t("obH" + s)) + "</h2>" + body +
    '<div class="onb-foot">' + (s > 0 ? '<button class="btn ghost" data-act="obBack">' + icon("back") + esc(t("back")) + "</button>" : "") + '<button class="btn" data-act="obNext"' + (ok ? "" : " disabled") + ">" + esc(s === steps - 1 ? t("obFinish") : t("continue")) + "</button></div></div></div>";
  $("#onbRoot").innerHTML = h;
  var nm = $("#obName"); if(nm) nm.addEventListener("input", function(){ OB.d.name = nm.value; });
}
function finishOnb(){
  var d = OB.d;
  profile = {name:S(d.name, 30) || t("you"), ui:d.ui, native:d.native, learning:d.learning, focus:d.learning[0], level:d.level, interests:d.interests, goal:d.goal, daily:d.daily, hue:hashStr(d.name + Date.now()) % 360, created:Date.now()};
  UI = d.ui; store.set("profile", profile); store.set("ui", UI);
  OB = null; $("#onbRoot").innerHTML = "";
  TR.to = profile.native === "en" ? (profile.learning[0] === "en" ? "fr" : "en") : profile.native;
  if(trEl){ trEl.to.value = TR.to; }
  applyTrLang();
  confetti(); sound("done");
  go("#/home");
  setTimeout(function(){ toast(t("welcomeToast",{name:profile.name})); }, 400);
}

/* ============================================================
   Actions (one delegated handler)
   ============================================================ */
function handleAct(a, e){
  var act = a.getAttribute("data-act"), id = a.getAttribute("data-id");
  switch(act){
    case "nav": go(a.getAttribute("data-to")); break;
    case "speak": e.stopPropagation(); say(a.getAttribute("data-text"), a.getAttribute("data-l")); break;
    case "daily": startLesson({id:"daily-" + dayKey(), l:focusLang(), title:t("startDaily"), items:dailyItems()}); break;
    case "lesson": var ls = lessonsFor(focusLang()).filter(function(x){ return x.id === id; })[0]; if(ls) startLesson(ls); break;
    case "focus": profile.focus = a.getAttribute("data-l"); store.set("profile", profile); renderLearn(); break;
    case "focusGo": var fl = a.getAttribute("data-l"); if(profile.learning.indexOf(fl) < 0) profile.learning.push(fl); profile.focus = fl; store.set("profile", profile); go("#/learn/path"); break;
    case "aiLesson": makeAILesson(a); break;
    case "review": startReview(); break;
    case "closePlayer": closePlayer(); break;
    case "lpNext": lpNext(); break;
    case "lpCheck": lpCheck(); break;
    case "lpPick": if(LP && !LP.checked){ LP.sel = LP.qs[LP.qi].options[+a.getAttribute("data-i")]; renderPlayer(); } break;
    case "flip": if(RV){ RV.flipped = !RV.flipped; renderReview(); } break;
    case "rate": if(RV){ rateCard(RV.cards[RV.i], a.getAttribute("data-r")); RV.done++; RV.i++; RV.flipped = false; addXP(2); sound(a.getAttribute("data-r") === "again" ? "bad" : "ok"); renderReview(); } break;
    case "addExpr": var ex = exprById(id); if(ex && addCard(ex, {src:"lesson", box:0})){ toast(t("addedOne")); sound("pop"); a.disabled = true; a.innerHTML = icon("check") + esc(t("inDeck")); renderTopStats(); renderNav(); } break;
    case "openExpr": showExpr(id); break;
    case "closeSheet": closeSheet(); break;
    case "toggleItem":
      var tl = a.getAttribute("data-l"), tm = a.getAttribute("data-term"), c0 = findCard(tl, tm);
      if(c0){ removeCard(c0.id); toast(t("removedDeck")); } else { var it = itemByKey(tl, tm); if(it){ addCard(it, {src:"lesson", box:0}); toast(t("addedOne")); sound("pop"); } }
      var on = !!findCard(tl, tm); a.classList.toggle("on", on); a.innerHTML = icon(on ? "check" : "plus"); renderTopStats(); renderNav(); break;
    case "delCard": removeCard(id); renderLearn(); renderTopStats(); break;
    case "used": var cu = deck.filter(function(c){ return c.id === id; })[0]; if(cu){ cu.used++; stats.used++; store.set("deck", deck); store.set("stats", stats); addXP(5, a); toast(t("usedToast")); renderLearn(); } break;
    case "quickTr": var q = $("#quickText"); if(!q.value.trim()){ toast(t("needText")); q.focus(); break; } TR.pending = q.value.trim(); go("#/translate"); break;
    case "where": connUI.where = a.getAttribute("data-w"); renderConnect(); break;
    case "like": var li = conn.liked.indexOf(id); if(li >= 0) conn.liked.splice(li, 1); else { conn.liked.push(id); sound("pop"); toast(t("likedToast")); } store.set("conn", conn); renderConnect(); break;
    case "send": var p1 = personById(id); if(p1) sendChat(p1); break;
    case "ice": var ib = (ICEBREAK[a.getAttribute("data-l")] || ICEBREAK.en)[+a.getAttribute("data-i")]; var ci = $("#chatIn"); if(ci && ib){ ci.value = ib[0]; ci.focus(); } break;
    case "coach": coachCheck(); break;
    case "useBetter": var cb = $("#chatIn"); if(cb && connUI.coach){ cb.value = connUI.coach; cb.focus(); } break;
    case "bubTr": var k = id + a.getAttribute("data-i"), m0 = (conn.chats[id] || [])[+a.getAttribute("data-i")]; if(m0 && m0.tr){ connUI.showTr[k] = m0.who === "them" ? connUI.showTr[k] === false : !connUI.showTr[k]; drawChat(personById(id)); } break;
    case "report": openSheet('<h2>' + esc(t("reportH")) + '</h2><p class="small muted">' + esc(t("reportTxt")) + '</p><div class="chips">' + ["rr1","rr2","rr3","rr4"].map(function(r){ return '<button class="chip" data-act="reportSend">' + esc(t(r)) + "</button>"; }).join("") + '</div><div class="row"><span class="spacer"></span><button class="btn ghost sm" data-act="closeSheet">' + esc(t("cancel")) + "</button></div>"); break;
    case "reportSend": closeSheet(); toast(t("reportThanks")); break;
    case "block": if(conn.blocked.indexOf(id) < 0) conn.blocked.push(id); store.set("conn", conn); toast(t("blockedToast")); go("#/connect"); break;
    case "rsvp": var ri = conn.rsvp.indexOf(id); if(ri >= 0) conn.rsvp.splice(ri, 1); else { conn.rsvp.push(id); sound("pop"); toast(t("rsvpToast")); } store.set("conn", conn); onRoute(); break;
    case "toggleLearn": var tlg = a.getAttribute("data-l"), ix = profile.learning.indexOf(tlg); if(ix >= 0){ if(profile.learning.length > 1) profile.learning.splice(ix, 1); else toast(t("keepOne")); } else profile.learning.push(tlg); if(profile.learning.indexOf(profile.focus) < 0) profile.focus = profile.learning[0]; store.set("profile", profile); renderProfile(); renderNav(); break;
    case "toggleInt": var ii = a.getAttribute("data-i"), ij = profile.interests.indexOf(ii); if(ij >= 0) profile.interests.splice(ij, 1); else profile.interests.push(ii); store.set("profile", profile); a.setAttribute("aria-pressed", String(ij < 0)); break;
    case "setDaily": profile.daily = +a.getAttribute("data-n"); store.set("profile", profile); renderProfile(); renderTopStats(); break;
    case "togSound": prefs.sound = !prefs.sound; store.set("prefs", prefs); a.setAttribute("aria-checked", String(prefs.sound)); if(prefs.sound) sound("ok"); break;
    case "togAuto": prefs.autoDeck = !prefs.autoDeck; store.set("prefs", prefs); a.setAttribute("aria-checked", String(prefs.autoDeck)); break;
    case "saveApi": prefs.api = S($("#setApi").value, 300); store.set("prefs", prefs); resetSampler(); $("#apiStatus").textContent = apiURL() ? t("aiSet") : t("aiNotSet"); toast(t("saved")); break;
    case "testApi":
      prefs.api = S($("#setApi").value, 300); store.set("prefs", prefs); resetSampler();
      var st = $("#apiStatus"); st.textContent = t("testing");
      aiJSON('You are SlangBridge\'s connection test. Return only this JSON object: {"ok": true}').then(function(v){ st.textContent = v && v.ok ? "✅ " + t("aiOk") : "⚠️ " + t("errFail"); }).catch(function(err){ st.textContent = "⚠️ " + aiError(err); });
      break;
    case "redoOnb": startOnboarding(); OB.d = Object.assign(OB.d, {name:profile.name, native:profile.native, learning:profile.learning.slice(), level:profile.level, interests:profile.interests.slice(), goal:profile.goal, daily:profile.daily}); renderOnb(); break;
    case "plan": toast(t(a.getAttribute("data-p") === "soon" ? "planSoon" : "planContact")); break;
    case "export": exportData(); break;
    case "wipe": openSheet('<div style="text-align:center">' + mascot("sad", 90) + '</div><h2 style="text-align:center">' + esc(t("wipeH")) + '</h2><p class="small muted" style="text-align:center">' + esc(t("wipeTxt")) + '</p><div class="row"><button class="btn ghost block" data-act="closeSheet">' + esc(t("cancel")) + '</button><button class="btn bad block" data-act="wipeYes">' + esc(t("deleteData")) + "</button></div>"); break;
    case "wipeYes": store.clear(); location.hash = ""; location.reload(); break;
    case "obUi": OB.d.ui = a.getAttribute("data-l"); UI = OB.d.ui; document.documentElement.lang = UI; renderOnb(); break;
    case "obNative": OB.d.native = a.getAttribute("data-l"); OB.d.learning = OB.d.learning.filter(function(l){ return l !== OB.d.native; }); renderOnb(); break;
    case "obLearn": var ol = a.getAttribute("data-l"), oi = OB.d.learning.indexOf(ol); if(oi >= 0) OB.d.learning.splice(oi, 1); else OB.d.learning.push(ol); renderOnb(); break;
    case "obLevel": OB.d.level = a.getAttribute("data-v"); renderOnb(); break;
    case "obInt": var oi2 = a.getAttribute("data-i"), ok2 = OB.d.interests.indexOf(oi2); if(ok2 >= 0) OB.d.interests.splice(ok2, 1); else OB.d.interests.push(oi2); renderOnb(); break;
    case "obGoal": OB.d.goal = a.getAttribute("data-g"); renderOnb(); break;
    case "obDaily": OB.d.daily = +a.getAttribute("data-n"); renderOnb(); break;
    case "obBack": OB.step = Math.max(0, OB.step - 1); renderOnb(); break;
    case "obNext": if(OB.step === 0){ var nmi = $("#obName"); OB.d.name = nmi ? nmi.value : OB.d.name; } if(OB.step >= 5) finishOnb(); else { OB.step++; sound("pop"); renderOnb(); } break;
  }
}
document.addEventListener("click", function(e){
  var a = e.target.closest("[data-act]");
  if(!a || a.disabled) return;
  if(a.closest(".sheet") && !a.classList.contains("sheet-bg")) return;
  handleAct(a, e);
});
document.addEventListener("keydown", function(e){
  if(LP && $("#playerRoot").firstChild){
    if(LP.phase === "quiz" && !LP.checked && /^[1-4]$/.test(e.key)){ var q = LP.qs[LP.qi]; if(q.options[+e.key - 1] != null){ LP.sel = q.options[+e.key - 1]; renderPlayer(); } }
    else if(e.key === "Enter"){ e.preventDefault(); if(LP.phase === "quiz" && !LP.checked) lpCheck(); else if(LP.phase === "done") closePlayer(); else lpNext(); }
    else if(e.key === "Escape") closePlayer();
  } else if(RV && $("#playerRoot").firstChild){
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); if(!RV.flipped && RV.i < RV.cards.length){ RV.flipped = true; renderReview(); } else if(RV.i >= RV.cards.length) closePlayer(); }
    else if(RV.flipped && /^[1-4]$/.test(e.key)){ var b = $$(".rate button")[+e.key - 1]; if(b) b.click(); }
    else if(e.key === "Escape") closePlayer();
  } else if(e.key === "Escape" && $("#sheetRoot").firstChild) closeSheet();
});

/* ============================================================
   Start
   ============================================================ */
function start(){
  applyTheme();
  document.documentElement.lang = UI === "zh" ? "zh-CN" : UI;
  initTranslator();
  window.addEventListener("hashchange", onRoute);
  if(!profile){ renderNav(); startOnboarding(); }
  else onRoute();
}
start();

})();
</script>
</body>
</html>
