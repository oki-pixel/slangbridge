/* ---------- Lessons and challenges ---------- */
function startLesson(lesson){
  if(!lesson || !lesson.items || !lesson.items.length) return;
  var items = lesson.items.slice(0, 5);
  LP = {lesson:lesson, items:items, phase:lesson.quizOnly ? "quiz" : "learn", i:0, qs:buildQuestions(items, lesson.l), qi:0, sel:null, checked:false, correct:0, combo:0, best:0, steps:0};
  LP.total = (lesson.quizOnly ? 0 : items.length) + LP.qs.length;
  renderPlayer();
}
function buildQuestions(items, l){
  var pool = allItems(l), qs = [], li = lvlIdx(l);
  items.forEach(function(it){
    var extra = [], token = it.term.split(" / ")[0];
    var line = (it.chat || []).filter(function(c){ return c[1].indexOf(token) >= 0; })[0];
    var meaning = {type:"meaning", item:it, options:shuffle([it.mean].concat(distractors(pool, "mean", it.mean, 3))), answer:it.mean};
    if(line) extra.push({type:"chat", item:it, line:line, token:token, options:shuffle([token].concat(distractors(pool.map(function(p){ return {term:p.term.split(" / ")[0]}; }), "term", token, 3))), answer:token});
    extra.push({type:"term", item:it, options:shuffle([it.term].concat(distractors(pool, "term", it.term, 3))), answer:it.term});
    if(it.reg) extra.push({type:"reg", item:it, options:["regA","regB","regC"], answer:regAnswer(it.reg)});
    if(canSpeak(it.l)) extra.push({type:"listen", item:it, options:shuffle([it.term].concat(distractors(pool, "term", it.term, 3))), answer:it.term});
    /* Beginners always see the meaning question; advanced learners get more context questions. */
    if(li <= 3 || Math.random() < 0.5) qs.push(meaning);
    qs.push(extra[Math.floor(Math.random() * extra.length)]);
  });
  return shuffle(qs).slice(0, Math.max(4, Math.min(7, items.length * 2)));
}
function startChallenge(l, s){
  getSampler().then(function(sm){
    if(sm) startPractice({sc:STAGE_SCENARIO[s], l:l, challenge:{l:l, s:s}});
    else { toast(t("chalNoAI")); startChallengeQuiz(l, s); }
  });
}
function startChallengeQuiz(l, s, rpScore){
  var items = shuffle(stageItems(l, s)).slice(0, 4);
  if(items.length < 4) items = items.concat(shuffle(deck.filter(function(c){ return c.l === l; })).slice(0, 4 - items.length));
  if(items.length < 4) items = items.concat(shuffle(allItems(l).filter(function(e){ return inVariant(e); })).slice(0, 4 - items.length));
  startLesson({id:"chal-" + chalKey(l, s), l:l, title:t("challengeOf",{name:t("st_" + STAGES[s])}), items:items, quizOnly:true, challenge:{l:l, s:s, rp:rpScore}});
}
function finishLesson(){
  LP.phase = "done";
  var acc = Math.round(100 * LP.correct / LP.qs.length);
  var xp = 10 + LP.correct * 2 + (acc === 100 ? 5 : 0), l = LP.lesson.l, c = LP.lesson.challenge;
  LP.banner = "";
  if(!LP.lesson.quizOnly) LP.items.forEach(function(e){ addCard(e, {src:"lesson", box:1}); });
  if(c){
    if(acc >= PASS){
      var key = chalKey(c.l, c.s), score = c.rp != null ? Math.round((acc + c.rp) / 2) : acc;
      if(c.s === 4){
        var from = lvlFor(c.l), next = LEVELS[Math.min(5, LEVELS.indexOf(from) + 1)];
        chal[key] = score; xp += 50;
        if(next !== from){ profile.langs[c.l].level = next; store.set("profile", profile); }
        LP.banner = next !== from ? t("leveledUp",{lang:langName(c.l), lvl:next}) : t("maxLevel");
        LP.levelUp = true;
      } else { chal[key] = score; xp += 20; LP.banner = t("stagePassed",{name:t("st_" + STAGES[c.s + 1])}); }
      store.set("chal", chal);
    } else { LP.banner = t("chalFail",{n:PASS}); LP.failed = true; }
  } else {
    lessonsDone[LP.lesson.id] = Math.max(lessonsDone[LP.lesson.id] || 0, acc);
    store.set("lessons", lessonsDone);
  }
  addXP(xp, null, l);
  if(!LP.failed){ sound("done"); confetti(); if(LP.levelUp) setTimeout(confetti, 900); } else sound("bad");
  renderPlayer();
}

/* ---------- Placement test: adaptive, 2 minutes, 8 questions max ---------- */
var PT = null, PTQ = [];
function startPlacement(l){
  if(!PLACE[l]){ return; }
  PT = {l:l, idx:2, asked:[], hist:[], start:Date.now(), q:null, done:false, result:null};
  nextPlacementQ(); renderPlacement();
  clearInterval(PT.timer);
  PT.timer = setInterval(function(){
    if(!PT || PT.done){ return; }
    var left = 120 - Math.floor((Date.now() - PT.start) / 1000);
    var tEl = $("#ptTime"); if(tEl) tEl.textContent = Math.max(0, Math.floor(left / 60)) + ":" + String(Math.max(0, left % 60)).padStart(2, "0");
    if(left <= 0) finishPlacement();
  }, 500);
}
function nextPlacementQ(){
  var bank = PLACE[PT.l], best = null;
  for(var d = 0; d < 6 && !best; d++){
    [PT.idx - d, PT.idx + d].forEach(function(lv){
      if(best) return;
      bank.forEach(function(q, i){ if(!best && q[0] === lv && PT.asked.indexOf(i) < 0) best = {i:i, q:q}; });
    });
  }
  if(!best){ finishPlacement(); return; }
  PT.asked.push(best.i);
  PT.q = {lv:best.q[0], type:best.q[1], msg:best.q[2], answer:best.q[3][0], opts:shuffle(best.q[3])};
}
function answerPlacement(i){
  if(!PT || PT.done) return;
  var ok = PT.q.opts[i] === PT.q.answer;
  PT.hist.push({lv:PT.q.lv, ok:ok});
  PT.idx = clamp(PT.q.lv + (ok ? 1 : -1), 0, 5);
  sound("pop");
  if(PT.hist.length >= 8 || Date.now() - PT.start > 120000){ finishPlacement(); return; }
  nextPlacementQ(); if(!PT.done) renderPlacement();
}
function finishPlacement(){
  if(!PT || PT.done) return;
  PT.done = true; clearInterval(PT.timer);
  /* Highest level answered correctly, one lower if the learner missed several easier questions. */
  var oks = PT.hist.filter(function(h){ return h.ok; }).map(function(h){ return h.lv; });
  var est = oks.length ? Math.max.apply(null, oks) : 0;
  var missedBelow = PT.hist.filter(function(h){ return !h.ok && h.lv < est; }).length;
  if(missedBelow >= 2) est -= 1;
  PT.result = LEVELS[clamp(est, 0, 5)];
  renderPlacement();
}
function renderPlacement(){
  var root = $("#playerRoot");
  if(!PT){ return; }
  if(PT.done){
    var lv = PT.result;
    var body = '<div class="learn-card result">' + mascot("wow", 120, "jump") + '<p class="kicker">' + esc(langFlag(PT.l) + " " + langName(PT.l)) + '</p><p class="big">' + esc(t("ptResult",{lvl:lv})) + '</p><p class="muted">' + esc(t("lv_" + lv) + " · " + t("lvd_" + lv)) + "</p>" +
      '<p class="small">' + esc(t("ptAnswered",{n:PT.hist.filter(function(h){ return h.ok; }).length, m:PT.hist.length})) + '</p><div class="chips" style="justify-content:center">' +
      LEVELS.map(function(x){ return '<button class="chip" data-act="ptPick" data-v="' + x + '" aria-pressed="' + (x === lv) + '">' + x + "</button>"; }).join("") + "</div>" +
      '<p class="tiny muted">' + esc(t("ptAdjust")) + "</p></div>";
    root.innerHTML = playerShell(body, '<span class="spacer"></span><button class="btn" data-act="ptAccept">' + esc(t("ptStart",{lvl:lv})) + "</button>", "", 1, "pt-done");
    return;
  }
  var q = PT.q;
  var body2 = '<div class="row"><p class="kicker">' + esc(t("placementT") + " · " + langFlag(PT.l) + " " + langName(PT.l)) + '</p><span class="spacer"></span><span class="pill-stat" id="ptTime">' + (function(){ var left = Math.max(0, 120 - Math.floor((Date.now() - PT.start) / 1000)); return Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); })() + "</span></div>" +
    '<p class="q-prompt">' + esc(t(q.type === "r" ? "pqReply" : "pqMean")) + "</p>" +
    '<div class="chat"><div class="bub them" lang="' + PT.l + '" style="font-size:19px">' + esc(q.msg) + "</div></div>" +
    '<div class="opts">' + q.opts.map(function(o, i){ return '<button class="opt" data-act="ptAns" data-i="' + i + '" lang="' + PT.l + '"><span class="key">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>"; }).join("") + "</div>";
  root.innerHTML = playerShell(body2, '<span class="small muted">' + esc(t("ptHint")) + '</span><span class="spacer"></span><button class="btn ghost" data-act="ptSkip">' + esc(t("ptDontKnow")) + "</button>", "", PT.hist.length / 8, "pt" + PT.hist.length);
}

    }).join("") + "</div></div>";

  h += '<div class="grid2"><div class="panel"><div class="row"><h2>' + esc(t("last7")) + '</h2><span class="spacer"></span><span class="small muted">' + esc(t("goalLine",{n:profile.daily})) + "</span></div>" +
    '<div class="bars7">' + days.map(function(x){

    '<div class="heat" style="margin-top:14px">' + cells + "</div></div></div>";
  var ps = progressStats();
  h += '<div class="panel" style="margin-top:18px"><h2>' + esc(t("badgesH")) + '</h2><div class="badges" style="margin-top:14px">' + BADGES.map(function(b){
    var on = b.need(ps);
    return '<div class="bdg' + (on ? "" : " off") + '"><span class="ic">' + b.icon + "</span><b>" + esc(t("b_" + b.id)) + "</b><span>" + esc(t("bd_" + b.id)) + "</span></div>";

/* ---------- Onboarding: a level (or the test) and a region per language ---------- */
var renderOnbV1 = renderOnb;
renderOnb = function(){
  if(OB.step !== 3) return renderOnbV1();
  var d = OB.d;
  d.lv = d.lv || {}; d.vr = d.vr || {};

  var body = d.learning.map(function(l){
    var vs = VARIANTS[l];

      (vs ? '<div class="chips" style="margin-top:8px">' + vs.map(function(v){ return '<button class="chip" data-act="obVr" data-l="' + l + '" data-v="' + v.id + '" aria-pressed="' + (d.vr[l] === v.id) + '">' + v.flag + " " + esc(t("var_" + v.id)) + "</button>"; }).join("") + "</div>" : "") + "</div>";

    '<div class="say-row">' + mascot("happy", 96) + '<div class="speech">' + esc(t("obSay3b")) + "</div></div><h2>" + esc(t("obH3b")) + "</h2>" + body +

var finishOnbV1 = finishOnb;

  if(TR.to && VARIANTS[TR.to] && profile && profile.learning.indexOf(TR.to) >= 0) p = p.replace("Target language: " + LANG_FULL[TR.to], "Target language: " + langFull(TR.to));
